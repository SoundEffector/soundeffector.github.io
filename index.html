<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8"> <title>Audio Effects Editor</title> <style> body { margin:0; padding:0; font-family:sans-serif; background:#0a1a3a; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; } h1 { margin-top:20px; font-size:2.5rem; text-align:center; } #uploadContainer { margin-top:20px; margin-bottom:20px; } #file { padding:12px 25px; border-radius:25px; border:none; font-size:1.2rem; cursor:pointer; background:#fff; color:#0a1a3a; } .controls { display:flex; flex-direction:column; align-items:center; gap:15px; margin-bottom:120px; width:200px; } .control { width:100%; } .control label { display:block; margin-bottom:5px; font-weight:bold; } input[type=range] { width:100%; border-radius:15px; } .footer { position:fixed; bottom:0; left:0; width:100%; background:#000; padding:10px 0; display:flex; justify-content:center; gap:20px; } button { font-size:1.2rem; border-radius:50%; width:50px; height:50px; border:none; background:none; color:#fff; cursor:pointer; } button:hover { opacity:0.85; } #downloadBtn { padding: 10px 30px; /* 横幅を広めに */ min-width: 150px; /* 最低幅を設定 */ border-radius: 25px; /* 角丸 */ border: none; background-color: #1db954; color: #fff; font-size: 1.2rem; text-align: center; /* テキスト中央 */ cursor: pointer; transition: opacity 0.2s; } #downloadBtn:hover { opacity: 0.85; } #volume { -webkit-appearance: none; height: 5px; border-radius: 5px; background: #1db954; cursor: pointer; } #volume::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; cursor: pointer; } </style> </head> <body> <h1>Audio Effects Editor</h1> <div id="uploadContainer"> <input type="file" id="file" accept="audio/mp3,audio/wav"> <div id="fileInfo"></div> </div> <div class="controls"> <div class="control"> <label>Speed: <span id="speedVal"></span></label> <input type="range" id="speed" min="0" max="100" value="25"> </div> <div class="control"> <label>Reverb: <span id="reverbVal"></span></label> <input type="range" id="reverb" min="0" max="100" value="0"> </div> <div class="control"> <label>Bass Boost: <span id="bassVal"></span></label> <input type="range" id="bass" min="0" max="100" value="0"> </div> <button id="downloadBtn">Download</button> </div> <div class="footer"> <button id="playPauseBtn">▶</button> <input type="range" id="volume" min="0" max="100" value="100" style="position:absolute; right:20px; bottom:15px; width:120px;"> </div> <script> (() => { let audioCtx=null, audioBuffer=null, source=null, isPlaying=false; let masterGain, convolver, dryGain, wetGain, bassFilter; const fileIn = document.getElementById('file'); const playPauseBtn = document.getElementById('playPauseBtn'); const speedEl = document.getElementById('speed'); const reverbEl = document.getElementById('reverb'); const bassEl = document.getElementById('bass'); const speedVal = document.getElementById('speedVal'); const reverbVal = document.getElementById('reverbVal'); const bassVal = document.getElementById('bassVal'); function map(n,inMin,inMax,outMin,outMax){ return outMin + ((n-inMin)*(outMax-outMin)/(inMax-inMin)); } const downloadBtn = document.getElementById('downloadBtn'); function createWavFromAudioBuffer(buffer) { const numOfChan = buffer.numberOfChannels, length = buffer.length * numOfChan * 2 + 44, bufferArray = new ArrayBuffer(length), view = new DataView(bufferArray); function setUint16(data) { view.setUint16(offset, data, true); offset += 2; } function setUint32(data) { view.setUint32(offset, data, true); offset += 4; } let offset = 0; // RIFF chunk descriptor writeString('RIFF'); // 0-3 setUint32(length - 8); // ChunkSize 4-7 writeString('WAVE'); // 8-11 // fmt sub-chunk writeString('fmt '); setUint32(16); // Subchunk1Size setUint16(1); // PCM setUint16(numOfChan); setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * numOfChan * 2); setUint16(numOfChan * 2); setUint16(16); // data sub-chunk writeString('data'); setUint32(buffer.length * numOfChan * 2); // write interleaved data for(let i=0;i<buffer.length;i++){ for(let ch=0; ch<numOfChan; ch++){ let sample = buffer.getChannelData(ch)[i]; sample = Math.max(-1, Math.min(1, sample)); view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true); offset += 2; } } function writeString(s){ for(let i=0;i<s.length;i++) view.setUint8(offset++, s.charCodeAt(i)); } return new Blob([view], { type:'audio/wav' }); } const volumeEl = document.getElementById('volume'); function setVolume(val){ if(masterGain) masterGain.gain.setValueAtTime(val/100, audioCtx.currentTime); } volumeEl.addEventListener('input', ()=>{ setVolume(volumeEl.value); }); downloadBtn.addEventListener('click', async () => { if(!audioBuffer) return; // OfflineAudioContext でエフェクトを適用 const offlineCtx = new OfflineAudioContext(2, audioBuffer.length, audioCtx.sampleRate); const source = offlineCtx.createBufferSource(); source.buffer = audioBuffer; source.playbackRate.value = map(Number(speedEl.value),0,100,0.5,2.5); const dry = offlineCtx.createGain(); const wet = offlineCtx.createGain(); dry.gain.value = 1 - Number(reverbEl.value)/100; wet.gain.value = Number(reverbEl.value)/100; const convolverNode = offlineCtx.createConvolver(); convolverNode.buffer = makeImpulseResponse(offlineCtx,2.5,2.0); const bassNode = offlineCtx.createBiquadFilter(); bassNode.type = 'lowshelf'; bassNode.frequency.value = 200; bassNode.gain.value = map(Number(bassEl.value),0,100,0,20); source.connect(bassNode); bassNode.connect(dry); bassNode.connect(convolverNode); convolverNode.connect(wet); dry.connect(offlineCtx.destination); wet.connect(offlineCtx.destination); source.start(0); const renderedBuffer = await offlineCtx.startRendering(); const blob = createWavFromAudioBuffer(renderedBuffer); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'audio_effects.wav'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }); function createAudioContextIfNeeded(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value=1; masterGain.connect(audioCtx.destination); dryGain = audioCtx.createGain(); wetGain = audioCtx.createGain(); dryGain.connect(masterGain); wetGain.connect(masterGain); convolver = audioCtx.createConvolver(); convolver.buffer = makeImpulseResponse(audioCtx,2.5,2.0); convolver.connect(wetGain); bassFilter = audioCtx.createBiquadFilter(); bassFilter.type='lowshelf'; bassFilter.frequency.value=200; } } function makeImpulseResponse(ctx, seconds=3, decay=2){ const rate = ctx.sampleRate; const length = rate*seconds; const buf = ctx.createBuffer(2,length,rate); for(let ch=0; ch<2; ch++){ const data = buf.getChannelData(ch); for(let i=0;i<length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay); } } return buf; } async function loadFile(file){ createAudioContextIfNeeded(); const arrayBuffer = await file.arrayBuffer(); audioBuffer = await audioCtx.decodeAudioData(arrayBuffer); playAudio(); // 自動再生 } function stopSource(){ if(source){ try{ source.stop(0); }catch(e){} try{ source.disconnect(); }catch(e){} source=null; isPlaying=false; playPauseBtn.textContent='▶'; } } function createSource(){ if(!audioBuffer || !audioCtx) return null; const s = audioCtx.createBufferSource(); s.buffer = audioBuffer; s.loop = true; s.playbackRate.value = map(Number(speedEl.value),0,100,0.5,2.5); s.connect(bassFilter); bassFilter.connect(dryGain); bassFilter.connect(convolver); return s; } function updateControlsUI(){ const speedMul = map(Number(speedEl.value),0,100,0.5,2.5); speedVal.textContent = speedMul.toFixed(2)+'×'; reverbVal.textContent = reverbEl.value+'%'; bassVal.textContent = map(Number(bassEl.value),0,100,0,20).toFixed(1)+' dB'; } function applyRealtimeParams(){ if(source && source.playbackRate) source.playbackRate.setValueAtTime(map(Number(speedEl.value),0,100,0.5,2.5), audioCtx.currentTime); dryGain.gain.setValueAtTime(1-Number(reverbEl.value)/100,audioCtx.currentTime); wetGain.gain.setValueAtTime(Number(reverbEl.value)/100,audioCtx.currentTime); bassFilter.gain.setValueAtTime(map(Number(bassEl.value),0,100,0,20),audioCtx.currentTime); } function playAudio(){ if(!audioBuffer) return; if(!audioCtx) createAudioContextIfNeeded(); if(audioCtx.state==='suspended') audioCtx.resume(); stopSource(); source=createSource(); if(!source) return; if(!convolver.buffer) convolver.buffer=makeImpulseResponse(audioCtx,2.5,2.0); applyRealtimeParams(); source.start(0); isPlaying=true; playPauseBtn.textContent='⏸'; } playPauseBtn.addEventListener('click',()=>{ if(isPlaying){ audioCtx.suspend(); isPlaying=false; playPauseBtn.textContent='▶'; } else { audioCtx.resume(); isPlaying=true; playPauseBtn.textContent='⏸'; } }); fileIn.addEventListener('change', async(ev)=>{ const f = ev.target.files && ev.target.files[0]; if(!f) return; await loadFile(f); updateControlsUI(); }); [speedEl,reverbEl,bassEl].forEach(el=>{ el.addEventListener('input',()=>{ updateControlsUI(); applyRealtimeParams(); }); }); updateControlsUI(); })(); </script> </body> </html>
